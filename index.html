<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunID | زیرساخت پیچیده، اجرای یک‌کلیکی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #080c14;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* پس‌زمینه متحرک مدرن (Animated Glow Orbs) */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.45;
            animation: float 12s infinite alternate ease-in-out;
            z-index: 0;
        }

        .glow-1 {
            background: radial-gradient(circle, #38bdf8, #0284c7);
            top: -10%;
            right: -10%;
        }

        .glow-2 {
            background: radial-gradient(circle, #6366f1, #4f46e5);
            bottom: -10%;
            left: -10%;
            animation-delay: -6s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 40px) scale(1.15); }
        }

        /* کارت اصلی Glassmorphic */
        .container {
            position: relative;
            z-index: 10;
            max-width: 650px;
            width: 90%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: #38bdf8;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 1.2rem;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: 1.05rem;
            line-height: 1.7;
            margin-bottom: 2.2rem;
        }

        /* دکمه اکشن مدرن */
        .btn-lab {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 1rem 2rem;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.35);
            transition: all 0.3s ease;
        }

        .btn-lab:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(2, 132, 199, 0.5);
            background: linear-gradient(135deg, #0369a1, #4338ca);
        }

        .arrow {
            font-size: 1.2rem;
            transition: transform 0.2s ease;
        }

        .btn-lab:hover .arrow {
            transform: translateX(-4px);
        }

        footer {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: #475569;
        }
    </style>
</head>
<body>

    <!-- افکت‌های متحرک پس‌زمینه -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <!-- محتوای اصلی -->
    <main class="container">
        <div class="badge">
            <span class="dot"></span>
            پلتفرم هوشمند راه‌اندازی سرویس
        </div>

        <h1>پیچیدگی‌ها با ما،<br>اجرا با یک کلیک از شما!</h1>

        <p>
            <strong>RunID</strong> پل ارتباطی بین شما و دنیای هاستینگ، کلودفلر، وردپرس و درگاه‌های پرداخت است. بدون نیاز به دانش فنی، کانفیگ‌های سخت را به ساده‌ترین شکل ممکن دپلوی کنید.
        </p>

        <a href="https://lab.runid.ir" class="btn-lab">
            <span>ورود به آزمایشگاه (RunID Lab)</span>
            <span class="arrow">←</span>
        </a>

        <footer>
            RunID Ecosystem &copy; 2026
        </footer>
    </main>

</body>
</html>
