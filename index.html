<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunID | زیرساخت هوشمند و ابری</title>
    <!-- استفاده از فونت استاندارد و زیبای وزیرمتن -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #080c14;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* پس‌زمینه متحرک روان */
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.35;
            animation: float 14s infinite alternate ease-in-out;
            z-index: 0;
        }

        .glow-1 {
            background: radial-gradient(circle, #38bdf8, #0284c7);
            top: -10%;
            right: -10%;
        }

        .glow-2 {
            background: radial-gradient(circle, #818cf8, #4f46e5);
            bottom: -10%;
            left: -10%;
            animation-delay: -7s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 30px) scale(1.1); }
        }

        /* کارت اصلی */
        .container {
            position: relative;
            z-index: 10;
            max-width: 600px;
            width: 90%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            color: #38bdf8;
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 2rem;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.4;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #ffffff 40%, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        /* دکمه اکشن */
        .btn-lab {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: linear-gradient(135deg, #0284c7, #4f46e5);
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            padding: 0.9rem 2rem;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.35);
            transition: all 0.3s ease;
        }

        .btn-lab:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(2, 132, 199, 0.5);
        }

        .arrow {
            font-size: 1.1rem;
            transition: transform 0.2s ease;
        }

        .btn-lab:hover .arrow {
            transform: translateX(-4px);
        }

        footer {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <main class="container">
        <div class="badge">
            <span class="dot"></span>
            پلتفرم هوشمند راه‌اندازی سرویس
        </div>

        <h1>اتصال کدهای ابری، هوش مصنوعی و سرویس‌ها تنها با یک کلیک</h1>

        <p>
            با <strong>RunID</strong> بدون درگیری با تنظیمات پیچیده، سرویس‌های ابری مثل کلودفلر، مدل‌های هوش مصنوعی، هاست و وردپرس را به ساده‌ترین شکل ممکن دپلوی و مدیریت کنید.
        </p>

        <a href="https://lab.runid.ir" class="btn-lab">
            <span>ورود به آزمایشگاه (RunID Lab)</span>
            <span class="arrow">←</span>
        </a>

        <footer>
            RunID Ecosystem &copy; 2026
        </footer>
    </main>

</body>
</html>
